name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: cgp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@cgp/core && npm run build --workspace=@cgp/client
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run security:scan
      - run: npm test
      - run: npm run conformance:relay
      - run: npm run ops:drill

  docker-loadnet:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@cgp/core && npm run build --workspace=@cgp/client
      - run: npm run loadnet:run -- --profile smoke
      - run: npm run loadnet:rtp-audio
      - run: npm run loadnet:websocket-call-media
      - run: npm run loadnet:relay-topology
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadnet-results
          path: loadnet/results/*.json
          retention-days: 14
